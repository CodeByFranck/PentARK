[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pentark"
version = "0.1.0"
description = "Authorized-use Web Application Pentest Framework: assess, prioritize (CVSS v3.1), and report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PentARK contributors" }]
keywords = ["pentest", "web-security", "owasp", "cvss", "security-audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
]

# Runtime dependencies. Kept small and mainstream; external scanners (sqlmap,
# nikto, nuclei) are orchestrated as subprocesses, not imported.
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# PDF reporting pulls in reportlab (pure-Python, no system libraries), so it is
# an opt-in extra — the Markdown report needs nothing beyond the standard library.
report = ["reportlab>=4.0"]
# Metasploit integration is only needed for the (later, user-driven) exploitation
# phase, so it stays out of the core install.
exploit = ["pymetasploit3>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "reportlab>=4.0",  # so the PDF report path is covered by the test suite
]

[project.scripts]
pentark = "pentark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pentark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["pentark"]
